; bubble-screen firmware for the ESP32 "Cheap Yellow Display" (ESP32-2432S028R).
; A lean pixel engine: no LVGL, no display library. An 8-bit indexed
; framebuffer is drawn in software and streamed to the ILI9341 over DMA-fed SPI.
; Pins are hard-coded in src/main.cpp, so the generic esp32dev board works.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Don't toggle DTR/RTS on connect: the CYD's CH340 would reset the ESP32.
monitor_rts = 0
monitor_dtr = 0
build_flags = -O2 -D CORE_DEBUG_LEVEL=1
    ; keep the builder's home directory out of the paths embedded by __FILE__
    -ffile-prefix-map=${sysenv.HOME}=~
; 1.9 MB app partition (the firmware is ~1 MB with Wi-Fi and HTTP).
board_build.partitions = min_spiffs.csv
lib_deps = bblanchon/ArduinoJson@^7
