# Example Docker Compose file for the bubble-screen service.
# From service/:  cp .env.example .env  (fill it in), then
#                 docker compose -f deploy/compose.yml up -d --build
services:
  bubble-screen:
    build: ..
    env_file: ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped
